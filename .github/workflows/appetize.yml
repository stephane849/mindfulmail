name: Build & Deploy to Appetize

on:
  push:
    branches: [main, "claude/*"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindfulmail-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload to Appetize.io
        if: env.APPETIZE_API_TOKEN != ''
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            # Update existing app
            echo "Updating existing Appetize app ($APPETIZE_PUBLIC_KEY)..."
            RESPONSE=$(curl -sf \
              -X POST "https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY" \
              -H "Authorization: Bearer $APPETIZE_API_TOKEN" \
              -F "file=@$APK_PATH" \
              -F "platform=android")
          else
            # Create new app
            echo "Creating new Appetize app..."
            RESPONSE=$(curl -sf \
              -X POST "https://api.appetize.io/v1/apps" \
              -H "Authorization: Bearer $APPETIZE_API_TOKEN" \
              -F "file=@$APK_PATH" \
              -F "platform=android")
          fi

          PUBLIC_KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['publicKey'])")
          EMBED_URL="https://appetize.io/embed/$PUBLIC_KEY?device=pixel7&osVersion=33"
          APP_URL="https://appetize.io/app/$PUBLIC_KEY?device=pixel7&osVersion=33"

          echo "### Appetize Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Public key:** \`$PUBLIC_KEY\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run in browser:** $APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Save the public key as the \`APPETIZE_PUBLIC_KEY\` secret to update the same app on future pushes." >> $GITHUB_STEP_SUMMARY

          echo "appetize_public_key=$PUBLIC_KEY" >> $GITHUB_OUTPUT
          echo "appetize_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "Appetize URL: $APP_URL"
