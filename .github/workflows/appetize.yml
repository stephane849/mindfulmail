name: Build & Deploy to Appetize

on:
  push:
    branches: [main, "claude/*"]
  workflow_dispatch:
    inputs:
      appetize_token:
        description: 'Appetize API token (one-time use; set APPETIZE_API_TOKEN secret after first run)'
        required: false
        type: string
      appetize_public_key:
        description: 'Existing Appetize public key to update (leave blank to create new)'
        required: false
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindfulmail-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload to Appetize.io
        env:
          APPETIZE_API_TOKEN: ${{ inputs.appetize_token || secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ inputs.appetize_public_key || secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "No Appetize token provided — skipping upload."
            exit 0
          fi

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            echo "Updating existing Appetize app ($APPETIZE_PUBLIC_KEY)..."
            RESPONSE=$(curl -sf \
              -X POST "https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY" \
              -u "$APPETIZE_API_TOKEN:" \
              -F "file=@$APK_PATH" \
              -F "platform=android")
          else
            echo "Creating new Appetize app..."
            RESPONSE=$(curl -sf \
              -X POST "https://api.appetize.io/v1/apps" \
              -u "$APPETIZE_API_TOKEN:" \
              -F "file=@$APK_PATH" \
              -F "platform=android")
          fi

          PUBLIC_KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['publicKey'])")
          APP_URL="https://appetize.io/app/$PUBLIC_KEY?device=pixel7&osVersion=33"

          echo "### Appetize Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run in browser:** $APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Public key:** \`$PUBLIC_KEY\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Add these as repo secrets to enable auto-deploy on future pushes:" >> $GITHUB_STEP_SUMMARY
          echo "- \`APPETIZE_API_TOKEN\` = your token" >> $GITHUB_STEP_SUMMARY
          echo "- \`APPETIZE_PUBLIC_KEY\` = \`$PUBLIC_KEY\`" >> $GITHUB_STEP_SUMMARY

          echo "Appetize URL: $APP_URL"
